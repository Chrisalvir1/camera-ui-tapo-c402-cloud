name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck and Node regressions
        run: npm run typecheck && npm test

      - name: Python worker regressions
        run: |
          python -m pip install -r python/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install rebuild dependencies
        working-directory: ./rebuild
        run: npm ci

      - name: Build Camera.UI bundle
        working-directory: ./rebuild
        run: npx cui bundle
