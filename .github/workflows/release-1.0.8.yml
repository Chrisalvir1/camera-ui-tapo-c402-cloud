name: Release Tapo C402 Cloud 1.0.8

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-1.0.8.yml']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Verify exact release and active PyTapo contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "1.0.8"
          test "$(node -p 'require("./rebuild/package.json").version')" = "1.0.8"
          test "$(node -p 'require("./package-lock.json").version')" = "1.0.8"
          test "$(node -p 'require("./rebuild/package-lock.json").version')" = "1.0.8"
          grep -Fq 'pytapo==3.4.32' rebuild/src/index.ts
          grep -Fq 'pytapo-3.4.32-kasa-0.12.0' rebuild/src/index.ts
          grep -Fq '3.4.32' rebuild/src/worker-source.ts
          grep -Fq 'pytapo==3.4.32' python/requirements.txt
          grep -Fq '3.4.32' scripts/setup-telemetry.mjs
          ! grep -R -n --include='*.ts' --include='*.mjs' --include='requirements.txt' '3\.4\.31'             rebuild/src python scripts/setup-telemetry.mjs

      - name: Validate root project and upgrade contracts
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Validate Python worker
        run: |
          python -m pip install -r python/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          from importlib.metadata import version
          assert version("pytapo") == "3.4.32"
          assert version("python-kasa") == "0.12.0"
          PY

      - name: Validate active Camera.UI bundle
        working-directory: ./rebuild
        run: |
          npm ci
          npx cui bundle
          test -d bundle
          test "$(node -p 'require("./bundle/package.json").version')" = "1.0.8"

      - name: Publish npm package if absent
        working-directory: ./rebuild/bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global npm@12.2.3
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already published."
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
            npm publish --access public --registry=https://registry.npmjs.org/
          else
            npm publish --provenance --access public --registry=https://registry.npmjs.org/
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.0.8 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest             --title "Tapo C402 Cloud v1.0.8" --notes-file docs/RELEASE_NOTES_1.0.8.md
