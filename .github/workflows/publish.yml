name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: tapo-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Verify release version
        run: |
          node -e "const a=require('./package.json'),b=require('./rebuild/package.json'); if(a.version!==b.version) throw Error('Root/rebuild version mismatch')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./rebuild/package.json").version')"
          fi

      - name: Install root dependencies
        run: npm ci

      - name: Check types and Node regressions
        run: npm run typecheck && npm test

      - name: Check Python worker regressions
        run: |
          python -m pip install -r python/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install dependencies
        working-directory: ./rebuild
        run: npm ci

      - name: Build plugin bundle
        working-directory: ./rebuild
        run: npx cui bundle

      - name: Install latest npm for OIDC trusted publishing
        run: npm install --global npm@12.2.3

      - name: Remove deprecated npm config
        run: npm config delete always-auth --location=user || true

      - name: Publish to npm
        working-directory: ./rebuild/bundle
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; immutable version retained."
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing with NPM_TOKEN secret..."
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
            npm publish --access public
          else
            echo "Publishing via GitHub Actions OIDC Trusted Publishing..."
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish GitHub release after npm
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "Tapo C402 Cloud $GITHUB_REF_NAME" --notes-file "docs/RELEASE_NOTES_${version}.md"
          fi
