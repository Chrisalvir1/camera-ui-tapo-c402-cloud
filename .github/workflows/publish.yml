name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./rebuild
        run: npm install

      - name: Build plugin bundle
        working-directory: ./rebuild
        run: npx cui bundle

      - name: Install latest npm for OIDC trusted publishing
        run: npm install --global npm@11.21.0

      - name: Remove deprecated npm config
        run: npm config delete always-auth --location=user || true

      - name: Publish to npm
        working-directory: ./rebuild/bundle
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; immutable version retained."
            exit 0
          fi
          npm publish --provenance --access public
